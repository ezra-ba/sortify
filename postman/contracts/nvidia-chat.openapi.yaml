openapi: 3.0.3
info:
  title: Sortify NVIDIA Chat Completions Integration
  version: 0.1.0
  description: Minimal consumed contract from NVIDIA Build and the supplied non-streaming request. No live credentials or user files.
servers:
  - url: https://integrate.api.nvidia.com
paths:
  /v1/chat/completions:
    post:
      operationId: suggestFileTarget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, stream, chat_template_kwargs]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [system, user, assistant] }
                      content: { type: string }
                temperature: { type: number }
                top_p: { type: number }
                max_tokens: { type: integer }
                stream: { type: boolean, enum: [false] }
                chat_template_kwargs:
                  type: object
                  properties:
                    enable_thinking: { type: boolean, enum: [false] }
      responses:
        '200':
          description: Non-streaming completion; message content remains untrusted text and is separately validated by Sortify.
          content:
            application/json:
              schema:
                type: object
                properties:
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        finish_reason: { type: string }
                        message:
                          type: object
                          properties:
                            content: { type: string, nullable: true }
        '401': { description: Invalid credentials }
        '429': { description: Usage limit }
        '500': { description: Provider error }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
